var R=[{"r": "I have keys but open no locks.\nI have space but no room.\nYou can enter, but you can't go outside.\nWhat am I?", "a": "a keyboard"}, {"r": "The more you take,\nthe more you leave behind.\nWhat am I?", "a": "footsteps"}, {"r": "I have a neck but no head,\nand a body but no arms.\nWhat am I?", "a": "a bottle"}, {"r": "I have an eye but cannot see.\nI'm sharp, and I help mend what's torn.\nWhat am I?", "a": "a needle"}, {"r": "I have four legs but cannot walk.\nYou eat your dinner on my back.\nWhat am I?", "a": "a table"}, {"r": "I have teeth but cannot bite.\nI tidy your hair each morning.\nWhat am I?", "a": "a comb"}, {"r": "The wetter I get,\nthe more I dry you.\nWhat am I?", "a": "a towel"}, {"r": "You must break me\nbefore you can use me.\nWhat am I?", "a": "an egg"}, {"r": "I'm tall when I'm young\nand short when I'm old.\nWhat am I?", "a": "a candle"}, {"r": "I have a thumb and four fingers,\nbut I am not alive.\nWhat am I?", "a": "a glove"}, {"r": "I have a bed but never sleep,\na mouth but never eat.\nI run, yet I never walk.\nWhat am I?", "a": "a river"}, {"r": "It always goes up\nand never comes down.\nWhat is it?", "a": "your age"}, {"r": "You can catch me but not throw me,\nand I'll leave you sneezing.\nWhat am I?", "a": "a cold"}, {"r": "I have one head, one foot, and four legs,\nyet I cannot move.\nWhat am I?", "a": "a bed"}, {"r": "I travel all around the world\nwhile staying in one corner.\nWhat am I?", "a": "a stamp"}, {"r": "I'm a building with countless stories,\nyet nothing dramatic happens here.\nWhat am I?", "a": "a library"}, {"r": "I'm full of words but never speak.\nOpen me and I'll take you anywhere.\nWhat am I?", "a": "a book"}, {"r": "I have cities but no houses,\nmountains but no trees,\nand water but no fish.\nWhat am I?", "a": "a map"}, {"r": "I'm full of holes,\nyet I still hold water.\nWhat am I?", "a": "a sponge"}, {"r": "I go up when the rain comes down.\nWhat am I?", "a": "an umbrella"}, {"r": "I follow you all day\nb ": "a promise"}, {"r": "The more you take away from me,\nthe bigger I become.\nWhat am I?", "a": "a hole"}, {"r": "It belongs to you,\nbut others use it more than you do.\nWhat is it?", "a": "your name"}, {"r": "I run through towns and over hills,\nyet I never move an inch.\nWhat am I?", "a": "a road"}, {"r": "I have a thousand needles\nbut cannot sew.\nI thrive where rain is rare.\nWhat am I?", "a": "a cactus"}, {"r": "I let you look right through a wall\nwithout ever making a hole.\nWhat am I?", "a": "a window"}, {"r": "I have thirteen hearts\nbut not a single other organ.\nWhat am I?", "a": "a deck of cards"}, {"r": "I'm a tree you can carry\nright in your hand.\nWhat am I?", "a": "a palm"}, {"r": "I begin with T, end with T,\nand I'm full of T.\nWhat am I?", "a": "a teapot"}, {"r": "Forwards I am heavy,\nbut backwards I am not.\nWhat word am I?", "a": "ton"}, {"r": "I'm the only common word\nwith three double letters in a row.\nWhat am I?", "a": "bookkeeper"}, {"r": "I'm a five-letter word that becomes\nshorter when you add two letters.\nWhat am I?", "a": "short"}, {"r": "I have a ring but no finger,\nand when I ring, you answer.\nWhat am I?", "a": "a telephone"}, {"r": "What two things\ncan you never eat for breakfast?", "a": "lunch and dinner"}, {"r": "The more of me there is,\nthe less you can see.\nWhat am I?", "a": "darkness"}, {"r": "I sit between your ears\nand grow sharper the more you use me.\nWhat am I?", "a": "the brain"}, {"r": "I have a heart\nbut I have never loved.\nWhat am I?", "a": "an artichoke"}, {"r": "I have many branches\nbut no fruit, trunk, or leaves.\nWhat am I?", "a": "a bank"}, {"r": "Tell me\nand you no longer have me.\nWhat am I?", "a": "a secret"}, {"r": "You can spend me, save me, or waste me,\nbut you can never get me back.\nWhat am I?", "a": "time"}, {"r": "I'm always coming\nbut I never arrive.\nWhat am I?", "a": "tomorrow"}, {"r": "I visit you at night\nand vanish by morning,\nyet I feel completely real.\nWhat am I?", "a": "a d  "a compass"}, {"r": "Turn me over and sand will run\nto measure the passing time.\nWhat am I?", "a": "an hourglass"}, {"r": "I pull metal toward myself\nwithout ever touching it.\nWhat am I?", "a": "a magnet"}, {"r": "I freeze a single moment\nso you can keep it forever.\nWhat am I?", "a": "a photograph"}, {"r": "I keep your door shut tight,\nand only a key sets me free.\nWhat am I?", "a": "a lock"}, {"r": "Many links make me strong,\nand I bind and pull as one.\nWhat am I?", "a": "a chain"}, {"r": "I go round and round all day,\nand the open road is my home.\nWhat am I?", "a": "a wheel"}, {"r": "I store up power for later\nand slowly I run down.\nWhat am I?", "a": "a battery"}, {"r": "I sleep for years, then wake\nto pour out fire and ash.\nWhat am I?", "a": "a volcano"}, {"r": "I rise when it is hot\nand fall when it is cold,\nyet I have no legs at all.\nWhat am I?", "a": "a thermometer"}, {"r": "I am the quietest way to speak,\nmeant for one ear alone.\nWhat am I?", "a": "a whisper"}, {"r": "I pull everything down to earth,\nyet you can never see me.\nWhat am I?", "a": "gravity"}, {"r": "I spread from mouth to mouth,\noften untrue and hard to stop.\nWhat am I?", "a": "a rumour"}, {"r": "I am born inside your mind,\nand I can change the whole world.\nWhat am I?", "a": "an idea"}, {"r": "I can fill a whole room,\nyet I weigh nothing at all.\nWhat am I?", "a": "light"}, {"r": "I rise from a fire without form,\nand the wind can scatter me away.\nWhat am I?", "a": "smoke"}, {"r": "A plane crashes exactly on the border\nof two countries.\nWhere do you bury the survivors?", "a": "you don't bury survivors"}, {"r": "I am a five-letter word.\nRemove two letters\nand only one remains.\nWhat am I?", "a": "stone"}, {"r": "Which is heavier:\na pound of feathers\nor a pound of bricks?", "a": "they weigh the same"}, {"r": "How many months of the year\nhave twenty-eight days?", "a": "all of them"}, {"r": "A rooster sits on the peak of a barn\nand lays an egg.\nWhich way does it
